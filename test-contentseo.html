<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <style>
    /* ═══════════════════════════════════════════════════════
   GALLERY TUNNEL — Deep Dark Corridor
   All selectors scoped under #gallery-tunnel-wrapper
═══════════════════════════════════════════════════════ */

    #gallery-tunnel-wrapper {
      position: relative;
      height: 500vh;
      background: #000;
    }

    /* ── Sticky shell: viewport-locked canvas ── */
    #gallery-tunnel-wrapper .gt-sticky {
      position: sticky;
      top: 0;
      height: 100vh;
      overflow: hidden;
    }

    /* ── 3-D perspective scene ── */
    #gallery-tunnel-wrapper .gt-scene {
      position: absolute;
      inset: 0;
      perspective: 1000px;
      perspective-origin: 50% 48%;
    }

    /* ── Track: 3-D container — GSAP translates this in +Z ── */
    #gallery-tunnel-wrapper #gt-track {
      position: absolute;
      inset: 0;
      transform-style: preserve-3d;
      will-change: transform;
    }

    /* ── Paintings positioned in 3D space ── */
    #gallery-tunnel-wrapper .gt-painting {
      position: absolute;
      top: 50%;
      left: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    /* Z depths + alternating X offsets for corridor feel */
    #gallery-tunnel-wrapper .gt-painting[data-gt="0"] {
      transform: translate(-50%, -56%) translateZ(-600px) translateX(-70px);
    }
    #gallery-tunnel-wrapper .gt-painting[data-gt="1"] {
      transform: translate(-50%, -53%) translateZ(-1200px) translateX(90px);
    }
    #gallery-tunnel-wrapper .gt-painting[data-gt="2"] {
      transform: translate(-50%, -56%) translateZ(-1800px) translateX(-50px);
    }
    #gallery-tunnel-wrapper .gt-painting[data-gt="3"] {
      transform: translate(-50%, -52%) translateZ(-2400px) translateX(70px);
    }
    #gallery-tunnel-wrapper .gt-painting[data-gt="4"] {
      transform: translate(-50%, -54%) translateZ(-3000px) translateX(0px);
    }

    /* ── Wooden frame ── */
    #gallery-tunnel-wrapper .gt-frame {
      position: relative;
      padding: 10px;
      background: linear-gradient(
        145deg,
        #2a1408 0%,
        #0d0502 50%,
        #1c0c04 100%
      );
      border: 1.5px solid #E8D5B0;
      border-radius: 2px;
      /* Burgundy glow — the reflected wall light effect */
      box-shadow:
        0 0 50px rgba(107, 26, 26, 0.55),
        0 0 110px rgba(107, 26, 26, 0.28),
        0 0 200px rgba(107, 26, 26, 0.12),
        inset 0 1px 4px rgba(255, 180, 100, 0.07);
    }

    /* ── Image: starts near-black, GSAP drives brightness ── */
    #gallery-tunnel-wrapper .gt-img {
      display: block;
      width: 260px;
      height: 330px;
      object-fit: cover;
      border-radius: 1px;
      filter: brightness(0.02);
      will-change: filter;
    }

    /* ── Museum wall plaque ── */
    #gallery-tunnel-wrapper .gt-plaque {
      font-family: "Courier Prime", monospace;
      font-size: 9px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: rgba(107, 26, 26, 0.65);
      opacity: 0;
      white-space: nowrap;
    }

    /* ── Overlays (inside .gt-sticky, above .gt-scene) ── */

    /* Warm ceiling glow — JS drives opacity */
    #gallery-tunnel-wrapper #gt-glow {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      opacity: 0;
      background:
        radial-gradient(
          ellipse 55% 45% at 50% 0%,
          rgba(255, 218, 130, 0.14) 0%,
          transparent 70%
        ),
        radial-gradient(
          ellipse 35% 28% at 28% 0%,
          rgba(255, 200, 100, 0.07) 0%,
          transparent 60%
        ),
        radial-gradient(
          ellipse 35% 28% at 72% 0%,
          rgba(255, 200, 100, 0.07) 0%,
          transparent 60%
        );
    }

    /* Floor vignette */
    #gallery-tunnel-wrapper .gt-floor {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 38%;
      z-index: 2;
      pointer-events: none;
      background: linear-gradient(
        to top,
        rgba(0, 0, 0, 0.97) 0%,
        rgba(4, 1, 1, 0.55) 45%,
        transparent 100%
      );
    }

    /* Side + top/bottom vignettes — corridor walls illusion */
    #gallery-tunnel-wrapper .gt-vig {
      position: absolute;
      pointer-events: none;
      z-index: 2;
    }
    #gallery-tunnel-wrapper .gt-vig--l {
      top: 0;
      left: 0;
      bottom: 0;
      width: 24%;
      background: linear-gradient(
        to right,
        rgba(0, 0, 0, 0.97) 0%,
        transparent 100%
      );
    }
    #gallery-tunnel-wrapper .gt-vig--r {
      top: 0;
      right: 0;
      bottom: 0;
      width: 24%;
      background: linear-gradient(
        to left,
        rgba(0, 0, 0, 0.97) 0%,
        transparent 100%
      );
    }
    #gallery-tunnel-wrapper .gt-vig--t {
      top: 0;
      left: 0;
      right: 0;
      height: 18%;
      background: linear-gradient(
        to bottom,
        rgba(0, 0, 0, 0.92) 0%,
        transparent 100%
      );
    }
    #gallery-tunnel-wrapper .gt-vig--b {
      bottom: 0;
      left: 0;
      right: 0;
      height: 18%;
      background: linear-gradient(
        to top,
        rgba(0, 0, 0, 0.92) 0%,
        transparent 100%
      );
    }

    /* Exit void — fades to pure black at journey's end */
    #gallery-tunnel-wrapper #gt-void {
      position: absolute;
      inset: 0;
      z-index: 10;
      background: #000;
      pointer-events: none;
      opacity: 0;
    }
  </style>
  <body>
    <!-- ══════════════════════════════════════════
         GALLERY TUNNEL — Deep Dark Corridor
         5-screen scroll journey through paintings
    ══════════════════════════════════════════ -->
    <div id="gallery-tunnel-wrapper">
      <div class="gt-sticky">
        <!-- Warm ceiling glow — JS drives opacity -->
        <div id="gt-glow"></div>

        <!-- 3-D perspective scene -->
        <div class="gt-scene">
          <!-- Track: GSAP moves this in +Z (camera-forward effect) -->
          <div id="gt-track">
            <div class="gt-painting" data-gt="0">
              <div class="gt-frame">
                <img
                  class="gt-img"
                  src="https://images.unsplash.com/photo-1578926288207-a90a5366759d?w=480&q=80"
                  alt="I"
                />
              </div>
              <span class="gt-plaque">I — Untitled</span>
            </div>

            <div class="gt-painting" data-gt="1">
              <div class="gt-frame">
                <img
                  class="gt-img"
                  src="https://images.unsplash.com/photo-1579783902614-a3fb3927b6a5?w=480&q=80"
                  alt="II"
                />
              </div>
              <span class="gt-plaque">II — Study in Red</span>
            </div>

            <div class="gt-painting" data-gt="2">
              <div class="gt-frame">
                <img
                  class="gt-img"
                  src="https://images.unsplash.com/photo-1541961017774-22349e4a1262?w=480&q=80"
                  alt="III"
                />
              </div>
              <span class="gt-plaque">III — The Witness</span>
            </div>

            <div class="gt-painting" data-gt="3">
              <div class="gt-frame">
                <img
                  class="gt-img"
                  src="https://images.unsplash.com/photo-1578301978693-85fa9c0320b9?w=480&q=80"
                  alt="IV"
                />
              </div>
              <span class="gt-plaque">IV — Shadow Form</span>
            </div>

            <div class="gt-painting" data-gt="4">
              <div class="gt-frame">
                <img
                  class="gt-img"
                  src="https://images.unsplash.com/photo-1555685812-4b943f1cb0eb?w=480&q=80"
                  alt="V"
                />
              </div>
              <span class="gt-plaque">V — Memoria</span>
            </div>
          </div>
          <!-- /#gt-track -->
        </div>
        <!-- /.gt-scene -->

        <!-- Corridor overlays (above 3D scene, below void) -->
        <div class="gt-floor"></div>
        <div class="gt-vig gt-vig--l"></div>
        <div class="gt-vig gt-vig--r"></div>
        <div class="gt-vig gt-vig--t"></div>
        <div class="gt-vig gt-vig--b"></div>

        <!-- Exit: pure black swallows the corridor -->
        <div id="gt-void"></div>
      </div>
      <!-- /.gt-sticky -->
    </div>
    /#gallery-tunnel-wrapper
    <script src="">
      public/js/gallery-tunnel.js
    </script>
  </body>
</html>
